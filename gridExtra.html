<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Extra</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas:
                "header header header"
                "sidebar main aside"
                "footer footer footer";
            gap: 12px;
            height: 100vh;
            border: 2px solid black;

        }
        .header{ 
            grid-area: header;
            border: 2px solid black; 
            background-color: blue;
        }
        .sidebar{ 
            grid-area: sidebar; 
            border: 2px solid black; 
            background-color: limegreen;
        }
        .main{ 
            grid-area: main; 
            border: 2px solid black; 
            background-color: purple;
        }
        .aside{ 
            grid-area: aside; 
            border: 2px solid black; 
            background-color: orange;
        }
        .footer{ 
            grid-area: footer; 
            border: 2px solid black; 
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Header</h1>
        </div>
        <div class="sidebar">
            <h1>Sidebar</h1>
        </div>
        <div class="main">
            <h1>Main</h1>
        </div>
        <div class="aside">
            <h1>Aside</h1>
        </div>
        <div class="footer">
            <h1>Footer</h1>
        </div>
    </div>
</body>
</html>
