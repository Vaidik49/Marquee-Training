<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 3</title>
    <style>
        .container {
            height: 700px;
            width: 800px;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap : 15px;
            padding: 10px 10px 10px 10px;
            background-color: rgb(53, 20, 69);
        }
        .item1{
            background-color: rgb(70, 24, 103);
            border-radius: 10px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        
        .icon{
            height:45px;
            width:45px;
            background-color: rgb(133, 20, 214);
            border-radius: 10px;
            
        }
        .item2{
            background-color: rgb(70, 24, 103);
            border-radius: 10px;
            display: flex;
            justify-content:center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;

        }
        .item3{
            background-color: rgb(70, 24, 103);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        .item4{
            background-color: rgb(70, 24, 103);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        .item5{
            background-color: rgb(133, 20, 214);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        .item6{
            background-color: rgb(70, 24, 103);
            border-radius: 10px;
            grid-column: 1 /3;
            display: flex;
            justify-content: flex-start;
            color: white;
            font-size: 30px;
            font-weight: bold;
            padding: 20px;
        }
        .item7{
            background-color: white;
            border-radius: 10px;
            grid-column: 3 /-1;
            grid-row: 2 /4;
            display: flex;
            justify-content: center;
            align-items:end;
            color: black;
            font-size: 40px;
            font-weight: bold;
        }
        .text{
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">
            <div class="icon"></div>
            <div class="icon"></div>
            <div class="icon"></div>
            <div class="icon"></div>
            <div class="icon"></div>

        </div>
        <div class="item2">
            <h1>25K</h1>
        </div>
        <div class="item3">
            <h1>50K</h1>
        </div>
        <div class="item4">
            <h1>1,538</h1>
        </div>
        <div class="item5">
            <p>DESIGN</p>
        </div>
        <div class="item6">
            <p>A place to learn UI Design & <br> Web Design.</p>
        </div>
        <div class="item7">
            <div></div>
            <h1>200K</h1>
        </div>
    </div>
</body>
</html>
