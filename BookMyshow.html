<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book My Show</title>
    <style>
        .body{
            display: flex;
            justify-content: center; 
            height: 200vh;
            width: 100vw;
            flex-wrap: wrap;
        }
        .upbody{
            display: flex;
            justify-content: space-evenly; 
            height: 100px;
            width: 100vw;
        }
        .leftup{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 80px;
            width: 60vw;
        }
        .rightup{
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 80px;
            width: 40vw;

        }
        .item{
            height: 50px;
            width:500px;
            background-color: rgba(224, 210, 210, 0.774);
            margin: 20px;
            border-radius: 50px;
        }
        .logo{
            display: flex;
            justify-content: flex-start;
            height: 60px;
            width: 200px;
            margin: 20px;
            overflow: hidden;
        }
        .ul{
            display: flex;
            flex-direction: column;
            list-style-type: none;
            justify-content: space-evenly;
            align-items: center;
            margin-right: 20px;
            padding: 0;
            /* background-color: darkgray; */
        }
        .li{
            display: flex;
            height: 5px;
            width: 10px;
            border-radius: 5px;
            font-size: 20px;
            text-decoration: none;
            /* justify-content: center;
            align-items: center; */

        }
        .select{
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-right: 20px;
            height: 20px;
            width: 100px;
            border-radius: 5px;
        }
        .signin{
            height: 20px;
            width: 90px;
            border-radius: 5px;
            margin-right: 20px;
            text-align: center;
            text-decoration: none;
            background-color: red;

        }
        .secondbody{
            display: flex;
            justify-content: flex-start; 
            height: 100px;
            width: 100vw;
        }
        .leftup2{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 80px;
            width: 60vw;
            padding: 20px;
        }
        .rightup2{
            display: flex;
            justify-content: flex-end;
            align-items: center;
            /* text-align: center; */
            height: 80px;
            width: 40vw;
            padding: 20px;

        }
        .item2{
            height:20px;
            width:55px;
            border-radius: 5px;
            padding:10px 10px 10px 10px;
            text-align: center;
            /* background-color: rgba(110, 99, 99, 0.642); */
        }
        .item3{
            height:20px;
            width:90px;
            border-radius: 5px;
            padding:10px 10px 10px 10px;
            text-align: center;
            /* background-color: rgba(110, 99, 99, 0.642); */
        }
        .thirdbody{
            display: flex;
            justify-content: space-around; 
            height: 400px;
            width: 100vw;
            flex-wrap: wrap;
        }
        .moviecon{
            display: flex;
            justify-content: flex-start; 
            padding-left: 50px;
            padding-right: 50px;
            height: 400px;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
        }
        .name{
            display: flex;
            justify-content: flex-start; 
            text-align: center;
            padding-left: 50px;
            padding-right: 50px;
            height: 60px;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
            font-size: x-large;

        }
        .forthbody{
            display: flex;
            justify-content: space-around; 
            height: 90px;
            width: 80vw;
            flex-wrap: wrap;
            border-radius: 10px;
            overflow: hidden;
        }
        .lastbody{
            display: flex;
            justify-content: space-around; 
            align-items: center;
            height: 300px;
            width: 100vw;
        }
        .container{
            display: flex;
            justify-content: center;
            height: 200px;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
            flex-wrap: wrap;
        }

    </style>
</head>
<body>
    <div class="body">
        <div class="upbody">
            <div class="leftup">
                <div class="logo"><img src="logo.jpg" height="70px" width="200px"/></div>
                <div class="item"></div>
            </div>
            <div class="rightup">
                <div>
                    <select class="select" >
                        <option>Delhi</option>
                        <option>Surat</option>
                        <option>Vadodara</option>
                        <option>Mumbai</option>
                        <option>Ahemdabad</option>
                        <option>Kolkata</option>
                    </select>
                </div>
                <div class="signin" >sign in</div>
                <div>
                    <ul class="ul">
                        <li class="li">-</li>
                        <li class="li">-</li>
                        <li class="li">-</li>
                    </ul>
                </div>
            </div>
        </div>



        <div class="secondbody">
            <div class="leftup2">
                <div class="item2">Movies</div>
                <div class="item2">Stream</div>
                <div class="item2">Events</div>
                <div class="item2">Plays</div>
                <div class="item2">Sports</div>
                <div class="item3">Activities</div>
            </div>
            <div class="rightup2">
                <div class="item3">ListYourShow</div>
                <div class="item3">Corporates</div>
                <div class="item2">Offers</div>
                <div class="item3">Gift Cards</div>
            </div>
        </div>

        <div class="thirdbody">
            <div class="moviecon"><img src="1.jpg" height="400px" width="200px"/></div>
            <div class="moviecon"><img src="2.jpg" height="400px" width="200px"/></div>
            <div class="moviecon"><img src="3.jpg" height="400px" width="200px"/></div>
            <div class="moviecon"><img src="4.jpg" height="400px" width="200px"/></div>
            <div class="moviecon"><img src="5.jpg" height="400px" width="200px"/></div>
            <div class="name">The Great Grand Superhero</div>
            <div class="name">Pati Patni aur wo Do</div>
            <div class="name">Chand Mera Dil</div>
            <div class="name">Bhoot Bangla</div>
            <div class="name">Krishnavataram</div>
        </div>
        <div class="forthbody">
            <img src="6.jpg" height="90px" width="1500px"/>
        </div>
        <div class="lastbody">
            <div class="container"><img src="7.jpg" height="200px" width="200px"/></div>
            <div class="container"><img src="8.jpg" height="200px" width="200px"/></div>
            <div class="container"><img src="9.jpg" height="200px" width="200px"/></div>
            <div class="container"><img src="10.jpg" height="200px" width="200px"/></div>
            <div class="container"><img src="11.jpg" height="200px" width="200px"/></div>
        </div>
    </div>
</body>
</html>
